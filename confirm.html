<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="MI/NUITの注文内容の最終確認ページです。">
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Noto+Serif+JP:wght@200..900&display=swap" 
                rel="stylesheet">
        <!-- Font Awesome -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">       
        <!-- CSS -->
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/summary.css">
        <link rel="stylesheet" href="css/confirm.css">
        <title>Confirm | MI/NUIT</title>
    </head>
    <body>
        <header class="l-header">
            <div class="l-header__inner">
                <h1 class="l-header__logo">
                    <a href="index.html">
                        MI/NUIT
                    </a>
                </h1>
            </div>
        </header>
        <main class="l-main">
            <section class="p-confirm">
                <div class="l-container">
                    <h2 class="c-section-heading">
                        Order Confirmation
                    </h2>
                    <div class="p-confirm__wrapper">
                        <div class="p-confirm__content">
                            <!-- Delivery -->
                            <section class="p-confirm-card">
                                <h3 class="p-confirm-card__title">
                                    お届け先
                                </h3>
                                <dl class="p-confirm-card__list">
                                    <div class="p-confirm-card__row">
                                        <dt>お名前</dt>
                                        <dd id="confirm-name"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>フリガナ</dt>
                                        <dd id="confirm-kana"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>電話番号</dt>
                                        <dd id="confirm-phone"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>メールアドレス</dt>
                                        <dd id="confirm-email"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>郵便番号</dt>
                                        <dd id="confirm-postal"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>都道府県</dt>
                                        <dd id="confirm-prefecture"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>市区町村</dt>
                                        <dd id="confirm-city"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>番地</dt>
                                        <dd id="confirm-street"></dd>
                                    </div>
                                    <div class="p-confirm-card__row">
                                        <dt>建物名</dt>
                                        <dd id="confirm-building"></dd>
                                    </div>
                                </dl>
                            </section>
                            <!-- Payment -->
                            <section class="p-confirm-card">
                                <h3 class="p-confirm-card__title">
                                    お支払い方法
                                </h3>
                                <p id="confirm-payment"></p>
                            </section>
                        </div>
                        <aside class="p-summary">
                            <h3 class="p-summary__title">
                                Order Summary
                            </h3>
                            <p class="p-confirm__lead">
                                内容をご確認のうえ、<br>
                                「注文を確定する」を押してください。
                            </p>
                            <div class="p-summary__products">
                            </div>
                            <dl class="p-summary__list">
                                <div class="p-summary__row">
                                    <dt>商品数</dt>
                                    <dd id="confirm-count">
                                        0点
                                    </dd>
                                </div>
                                <div class="p-summary__row">
                                    <dt>小計</dt>
                                    <dd id="confirm-subtotal">
                                        ¥0
                                    </dd>
                                </div>
                                <div class="p-summary__row">
                                    <dt>送料</dt>
                                    <dd id="confirm-shipping">
                                        ¥0
                                    </dd>
                                </div>
                                <div class="p-summary__row">
                                    <dt>手数料</dt>
                                    <dd id="confirm-fee">
                                        ¥0
                                    </dd>
                                </div>
                                <div class="p-summary__row
                                            p-summary__total">
                                    <span>合計</span>
                                    <strong id="confirm-total">¥0</strong>
                                </div>
                            </dl>
                            <p
                                class="p-summary__shipping-message"
                                id="confirm-shipping-message">
                                5,000円以上のお買い上げで送料無料
                            </p>
                            <div class="p-confirm__actions">
                                <a
                                    href="checkout.html"
                                    class="c-button
                                            c-button--outline">
                                    入力内容を修正する
                                </a>
                                <button
                                    id="confirm-submit"
                                    type="button"
                                    class="c-button
                                            c-button--primary">
                                    注文を確定する
                                </button>
                            </div>
                        </aside>
                    </div>
                </div>
            </section>
        </main>  
            <script src="js/main.js"></script>
            <script src="js/confirm.js"></script>      
    </body>
</html>
